version: '3.8'

services:
  web:
    image: faq4265/todo-list:latest
    ports:
      - "9000:8000"  # map CI container port 8000 to host 9000
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - todo_network
    restart: always

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"  # avoid conflict with your live Mongo
    volumes:
      - mongodb_ci_data:/data/db
    networks:
      - todo_network
    restart: always

networks:
  todo_network:
    driver: bridge

volumes:
  mongodb_ci_data:
