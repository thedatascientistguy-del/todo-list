version: '3.8'

services:
  web:
    image: faq4265/todo-list:latest
    container_name: web_asg2
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb_asg2:27017/
    volumes:
      - ./:/app  # Jenkins workspace mounted into container
    command: >
      sh -c "pip install -r /app/requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - mongodb
    networks:
      - todo_network
    restart: always

  mongodb:
    image: mongo:latest
    container_name: mongodb_asg2
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data_asg2:/data/db
    networks:
      - todo_network
    restart: always

networks:
  todo_network:
    driver: bridge

volumes:
  mongodb_data_asg2:
