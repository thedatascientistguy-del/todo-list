version: '3.8'

services:
  web:
    image: faq4265/todo-list:latest
    ports:
      - "9000:8000"   # CI port to avoid conflict
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - todo_network

  mongodb:
    image: mongo:latest
    ports:
      - "27018:27017"  # CI port to avoid conflict
    volumes:
      - mongodb_ci_data:/data/db
    networks:
      - todo_network

  selenium_tests:
    build:
      context: .
      dockerfile: Dockerfile.selenium
    depends_on:
      - web
    networks:
      - todo_network

networks:
  todo_network:
    driver: bridge

volumes:
  mongodb_ci_data:
